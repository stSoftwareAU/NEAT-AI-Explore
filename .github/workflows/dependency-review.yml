name: Dependency Review

on:
  pull_request:
    # `*` does not cross a `/`, so it matches single-segment branches
    # (Develop, main) but never a `milestone/<slug>` branch. Add the
    # `milestone/*` glob so this gate also runs on milestone sub-issue PRs
    # (#497); without it those PRs merge into the milestone branch unchecked.
    branches: ["*", "milestone/*"]

# Cancel superseded runs when a PR receives a new commit so the latest push
# gets feedback fastest and we do not waste runner minutes on stale work
# (#258).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    # Cap the runner so a wedged dependency-review-action cannot hold the
    # runner for the GitHub default of 360 minutes (#257).
    timeout-minutes: 5
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # This job only checks out the repository for dependency-review-action;
          # it never pushes back or fetches private submodules, so the
          # GITHUB_TOKEN must not persist to .git/config where a compromised
          # step could read it (#459).
          persist-credentials: false
      # actions/dependency-review-action@v5.0.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
