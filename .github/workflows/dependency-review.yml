name: Dependency Review

on:
  pull_request:
    branches: ["*"]

# Cancel superseded runs when a PR receives a new commit so the latest push
# gets feedback fastest and we do not waste runner minutes on stale work
# (#258).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    # Cap the runner so a wedged dependency-review-action cannot hold the
    # runner for the GitHub default of 360 minutes (#257).
    timeout-minutes: 5
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # actions/dependency-review-action@v4.9.0
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
