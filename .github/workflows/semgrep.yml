name: Semgrep

on:
  pull_request:
    # `*` does not cross a `/`, so it matches single-segment branches
    # (Develop, main, feature-x) but never a `milestone/<slug>` branch. The
    # explicit `milestone/*` pattern keeps the scan gate running on milestone
    # sub-issue PRs too, instead of skipping them until the rollup PR (#496).
    branches: ["*", "milestone/*"]

# Cancel superseded runs when a PR receives a new commit so the latest push
# gets feedback fastest and we do not waste runner minutes on stale work
# (#258).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    # Cap the runner so a wedged semgrep scan cannot hold the runner for the
    # GitHub default of 360 minutes (#257).
    timeout-minutes: 15
    container:
      # Pinned to semgrep/semgrep 1.163.0 (Issue #256). The multi-arch
      # manifest digest below is immutable; an unpinned tag resolves at
      # runtime and exposes SEMGREP_APP_TOKEN to whatever the Semgrep
      # Docker Hub account last pushed.
      #
      # The tag is carried *alongside* the digest, not instead of it (#612).
      # The digest is what Docker pulls, so the image stays byte-for-byte
      # frozen; the tag is the part Renovate's docker manager and Dependabot
      # resolve a bump from. A tagless digest gives them nothing to compare,
      # so it never receives an automated bump and drifts silently behind
      # Semgrep's rule and CVE fixes.
      image: semgrep/semgrep:1.163.0@sha256:7cad2bc2d1e44f87f0bf4be6d1fa23aa90fb72015bebc89fb91385d813987a03
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # This job only scans the checkout; it never pushes back or fetches
          # private submodules, so the GITHUB_TOKEN must not be written to
          # .git/config where a later step could read it (#462).
          persist-credentials: false
      - run: semgrep ci --config p/default
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
