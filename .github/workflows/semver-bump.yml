name: Update Package Version

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTIONS_PUSH }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Check Version Update
        id: check_version
        run: |
          set -Eeuo pipefail

          # Get the base branch version
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} || true
          git show origin/${{ github.base_ref }}:version.json > /tmp/base_version.json 2>/dev/null || echo "{}" > /tmp/base_version.json

          BASE_VERSION=$(deno eval "try { const json = JSON.parse(Deno.readTextFileSync('/tmp/base_version.json')); console.log(json.version || ''); } catch { console.log(''); }")

          # Get the current PR version
          CURRENT_VERSION=$(deno eval "const json = JSON.parse(Deno.readTextFileSync('version.json')); console.log(json.version)")

          echo "Base version: $BASE_VERSION"
          echo "Current version: $CURRENT_VERSION"

          if [ -z \"$BASE_VERSION\" ]; then
            echo \"Could not determine base version, skipping update\"
            echo \"needs_update=false\" >> $GITHUB_OUTPUT
          elif [ \"$CURRENT_VERSION\" = \"$BASE_VERSION\" ]; then
            echo \"Version unchanged, will update patch version\"
            echo \"needs_update=true\" >> $GITHUB_OUTPUT
            echo \"base_version=$BASE_VERSION\" >> $GITHUB_OUTPUT
          else
            echo \"Version has been updated in PR\"
            echo \"needs_update=false\" >> $GITHUB_OUTPUT
          fi

      - name: Update Patch Version
        if: steps.check_version.outputs.needs_update == 'true'
        run: |
          set -Eeuo pipefail

          BASE_VERSION="${{ steps.check_version.outputs.base_version }}"

          # Parse version (e.g., 0.1.0 -> 0.1.1)
          IFS='.' read -ra VERSION_PARTS <<< "$BASE_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}

          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"

          echo "Updating version from $BASE_VERSION to $NEW_VERSION"

          deno eval "
            const json = JSON.parse(Deno.readTextFileSync('version.json'));
            json.version = '$NEW_VERSION';
            Deno.writeTextFileSync('version.json', JSON.stringify(json, null, 2) + '\n');
          "

          echo "Updated version to: $NEW_VERSION"

      - name: Commit Version Update
        if: steps.check_version.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-increment patch version"
          fi

      - name: Push Version Update
        if: steps.check_version.outputs.needs_update == 'true'
        run: |
          git push origin || echo "Push failed or no changes to push"
