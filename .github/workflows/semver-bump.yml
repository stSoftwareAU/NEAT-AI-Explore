name: Update Package Version

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop

# Cancel superseded runs when a PR receives a new commit so the latest push
# gets feedback fastest and we do not waste runner minutes on stale work
# (#258).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-version:
    runs-on: ubuntu-latest
    # Cap the runner so a wedged version bump / push cannot hold the runner
    # for the GitHub default of 360 minutes (#257).
    timeout-minutes: 10
    permissions:
      contents: write
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != 'Develop'
    steps:
      - name: Checkout Code
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          token: ${{ secrets.ACTIONS_PUSH }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Deno
        # denoland/setup-deno@v2.0.4
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Check Version Update
        id: check_version
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          set -E # errtrace: keep ERR traps in functions/subshells (#557)

          # Get the base branch version — route BASE_REF via env to defuse
          # GH Actions script-injection (Issue #217).
          git fetch origin "$BASE_REF:$BASE_REF" || true
          git show "origin/$BASE_REF:version.json" > /tmp/base_version.json 2>/dev/null || echo "{}" > /tmp/base_version.json

          BASE_VERSION=$(deno eval "try { const json = JSON.parse(Deno.readTextFileSync('/tmp/base_version.json')); console.log(json.version || ''); } catch { console.log(''); }")

          # Get the current PR version
          CURRENT_VERSION=$(deno eval "const json = JSON.parse(Deno.readTextFileSync('version.json')); console.log(json.version)")

          echo "Base version: $BASE_VERSION"
          echo "Current version: $CURRENT_VERSION"

          if [ -z "$BASE_VERSION" ]; then
            echo "Could not determine base version, skipping update"
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          elif [ "$CURRENT_VERSION" = "$BASE_VERSION" ]; then
            echo "Version unchanged, will update patch version"
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "Version has been updated in PR"
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Patch Version
        if: steps.check_version.outputs.needs_update == 'true'
        env:
          BASE_VERSION: ${{ steps.check_version.outputs.base_version }}
        run: |
          set -euo pipefail
          set -E # errtrace: keep ERR traps in functions/subshells (#557)

          # Parse version (e.g., 0.1.0 -> 0.1.1)
          IFS='.' read -ra VERSION_PARTS <<< "$BASE_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}

          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"

          echo "Updating version from $BASE_VERSION to $NEW_VERSION"

          # Pass NEW_VERSION to deno via env so it is not concatenated into
          # the script source (defence in depth, Issue #217).
          NEW_VERSION="$NEW_VERSION" deno eval "
            const json = JSON.parse(Deno.readTextFileSync('version.json'));
            json.version = Deno.env.get('NEW_VERSION');
            Deno.writeTextFileSync('version.json', JSON.stringify(json, null, 2) + '\n');
          "

          echo "Updated version to: $NEW_VERSION"

      - name: Commit Version Update
        if: steps.check_version.outputs.needs_update == 'true'
        run: |
          set -euo pipefail
          set -E # errtrace: keep ERR traps in functions/subshells (#557)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-increment patch version"
          fi

      - name: Push Version Update
        if: steps.check_version.outputs.needs_update == 'true'
        run: |
          git push origin || echo "Push failed or no changes to push"
