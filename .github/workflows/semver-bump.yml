name: SemVer bump (PR safety)

on:
  pull_request_target:
    branches: [Develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}" --depth=1

      - name: Auto-bump patch if version unchanged
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          base_version="$(git show "origin/${BASE_REF}:version.json" | python3 - <<'PY'
          import json,sys
          obj=json.load(sys.stdin)
          print(obj["version"])
          PY
          )"

          head_version="$(python3 - <<'PY'
          import json
          with open("version.json","r",encoding="utf-8") as f:
            obj=json.load(f)
          print(obj["version"])
          PY
          )"

          echo "Base version: ${base_version}"
          echo "Head version: ${head_version}"

          if [ "${base_version}" != "${head_version}" ]; then
            echo "Version already changed in PR; no bump needed."
            exit 0
          fi

          bumped="$(python3 - <<'PY'
          import json,re
          with open("version.json","r",encoding="utf-8") as f:
            obj=json.load(f)
          v=obj.get("version","")
          m=re.match(r"^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$", v)
          if not m:
            raise SystemExit(f"Invalid SemVer in version.json: {v}")
          major,minor,patch=map(int,m.groups())
          patch += 1
          obj["version"]=f"{major}.{minor}.{patch}"
          with open("version.json","w",encoding="utf-8") as f:
            json.dump(obj,f,indent=2)
            f.write(\"\\n\")
          print(obj["version"])
          PY
          )"

          echo "Bumped version to ${bumped}"

          git status --porcelain
          if git diff --quiet; then
            echo "No changes after bump; exiting."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore(version): bump to ${bumped}"
          git push
