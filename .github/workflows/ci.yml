name: Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check helpers/ scripts/ tests/

      - name: Tests
        run: deno test -A
