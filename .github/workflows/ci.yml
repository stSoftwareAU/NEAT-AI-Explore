name: Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # Cap the runner so a wedged deno test / type check cannot hold the
    # runner for the GitHub default of 360 minutes (#257).
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Deno
        # denoland/setup-deno@v2.0.4
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        # Issue #210 — keep aligned with quality.sh; cover docs/ so type
        # errors in the published PWA are not invisible to CI.
        run: deno check helpers/ scripts/ tests/ docs/

      - name: Tests
        run: deno test -A
