# Weekly Deno dependency bumps, modelled on NEAT-AI-core's
# upgrade-dependencies workflow (Cargo) but adapted for Deno tooling.
name: Upgrade Deno Dependencies

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    name: Upgrade dependencies and create PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2 — pinned to a 40-char commit SHA so a
        # hijacked tag cannot exfiltrate CI secrets (#190).
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: Develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Deno
        # denoland/setup-deno@v2.0.4
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: External dependency quarantine gate
        # Block the upgrade if any external package (JSR, npm, deno.land/x)
        # has a latest version published less than VIBE_BUMP_QUARANTINE_HOURS
        # hours ago — and fail-close on raw https:// specifiers that cannot
        # be age-checked. Closes the cron-window exposure to freshly-published
        # malicious versions (#189, widened in #223 for npm + deno.land/x).
        env:
          VIBE_BUMP_QUARANTINE_HOURS: ${{ vars.VIBE_BUMP_QUARANTINE_HOURS || '24' }}
        run: |
          deno run --allow-read \
            --allow-net=api.jsr.io,registry.npmjs.org,cdn.deno.land,deno.land \
            scripts/jsr_quarantine_check.ts deno.json

      - name: Upgrade dependencies
        run: |
          deno outdated --latest 2>&1 | tee upgrade-dry-run.txt || true
          deno outdated --update --latest 2>&1 | tee upgrade.log || true

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- 'deno.json' '**/deno.json' 'deno.lock'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No deno.json / deno.lock dependency changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- 'deno.json' '**/deno.json' 'deno.lock'
          fi

      - name: Build summary
        if: steps.changes.outputs.changed == 'true'
        id: summary
        run: |
          {
            echo 'body<<EOF'
            echo '## Dependency Upgrades'
            echo ''
            echo '### Changes'
            echo '```'
            cat upgrade-dry-run.txt
            echo '```'
            echo ''
            echo 'This PR was automatically generated by the scheduled Deno dependency upgrade workflow.'
            echo 'It mirrors the behaviour of NEAT-AI-core''s Cargo upgrade workflow, adapted for Deno.'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        # peter-evans/create-pull-request@v7.0.11 — pinned to a 40-char
        # commit SHA. This third-party action runs weekly with
        # contents:write + pull-requests:write, so a hijacked v7 tag could
        # push to Develop and have deploy.yml publish attacker content
        # (#190).
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/upgrade-dependencies
          base: Develop
          title: "chore: upgrade Deno dependencies to latest compatible versions"
          body: ${{ steps.summary.outputs.body }}
          commit-message: "chore: upgrade deno.json dependencies to latest compatible versions"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          delete-branch: true
