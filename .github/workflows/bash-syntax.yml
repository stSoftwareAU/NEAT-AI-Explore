name: Bash Syntax

on:
  pull_request:
    # Draft PRs are work in progress (owner, 2026-10-23): CI runs
    # once, when the PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    # `*` does not cross a `/`, so it matches single-segment branches
    # (Develop, main) but never a `milestone/<slug>` branch. Add the
    # `milestone/*` glob so this gate also runs on milestone sub-issue PRs
    # (#497); without it those PRs merge into the milestone branch unchecked.
    branches: ["*", "milestone/*"]

# Cancel superseded runs when a PR receives a new commit so the latest push
# gets feedback fastest and we do not waste runner minutes on stale work
# (#258).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bash-syntax:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # Cap the runner so a wedged scan cannot hold it for the GitHub default of
    # 360 minutes (#257).
    timeout-minutes: 5
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # This job only reads the tree to parse scripts; it never pushes back
          # or fetches private submodules, so the GITHUB_TOKEN must not persist
          # to .git/config where a later step could read it (#463).
          persist-credentials: false
      - name: Run bash -n syntax gate (#479)
        run: ./quality/bash_syntax.sh
