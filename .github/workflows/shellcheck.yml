name: ShellCheck

on:
  pull_request:
    # `*` does not cross a `/`, so it matches single-segment branches
    # (Develop, main) but never a `milestone/<slug>` branch. Add the
    # `milestone/*` glob so this gate also runs on milestone sub-issue PRs
    # (#497); without it those PRs merge into the milestone branch unchecked.
    branches: ["*", "milestone/*"]

# Cancel superseded runs when a PR receives a new commit so the latest push
# gets feedback fastest and we do not waste runner minutes on stale work
# (#258).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    # Cap the runner so a wedged shellcheck scan cannot hold the runner for
    # the GitHub default of 360 minutes (#257).
    timeout-minutes: 5
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # This job only reads the tree to run ShellCheck; it never pushes
          # back or fetches private submodules, so the GITHUB_TOKEN must not be
          # persisted to .git/config where a later step could read it (#463).
          persist-credentials: false
      # Invoke the committed gate script rather than a third-party action so
      # the shellcheck configuration is a single source of truth that also runs
      # locally via `quality.sh` (#480). shellcheck is pre-installed on
      # ubuntu-latest runners; the gate fails loud if it is ever absent.
      - name: Run ShellCheck gate (#480)
        run: ./quality/shellcheck.sh
