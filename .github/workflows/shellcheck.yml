name: ShellCheck

on:
  pull_request:
    branches: ["*"]

# Cancel superseded runs when a PR receives a new commit so the latest push
# gets feedback fastest and we do not waste runner minutes on stale work
# (#258).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    # Cap the runner so a wedged shellcheck scan cannot hold the runner for
    # the GitHub default of 360 minutes (#257).
    timeout-minutes: 5
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # This job only reads the tree to run ShellCheck; it never pushes
          # back or fetches private submodules, so the GITHUB_TOKEN must not be
          # persisted to .git/config where a later step could read it (#463).
          persist-credentials: false
      # ludeeus/action-shellcheck — pinned to a 40-char commit SHA.
      # The upstream template uses @master, which is a moving ref and a
      # known supply-chain risk.
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          scandir: "."
          severity: warning
