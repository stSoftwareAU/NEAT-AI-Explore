name: Deploy to GitHub Pages

on:
  push:
    branches: [Develop]
    paths:
      - "docs/**"
      - "scripts/inject_build_id.ts"
      - "version.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Cap the runner so a wedged Pages deploy cannot hold the runner for the
    # GitHub default of 360 minutes (#257).
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # This job only reads docs, injects a build ID, generates an SBOM and
          # deploys to Pages — it never pushes back or fetches submodules, so the
          # GITHUB_TOKEN must not be persisted to .git/config (#460).
          persist-credentials: false

      - name: Setup Deno
        # denoland/setup-deno@v2.0.4
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Inject build ID into docs (cache busting)
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          deno run --allow-read --allow-write ./scripts/inject_build_id.ts "${GITHUB_SHA::8}"

      - name: Generate SBOM (CycloneDX) from deno.lock
        # Deno-native, lockfile-aware SBOM for the shipped app (#358). Enumerates
        # every resolved JSR + npm dependency so a later advisory can be matched
        # against exactly what was deployed.
        run: |
          deno run --allow-read --allow-write ./scripts/generate_sbom.ts deno.lock sbom.cdx.json

      - name: Upload SBOM artefact
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Setup Pages
        # Keep this aligned with ../GRQ-health to avoid behavioural differences.
        # actions/configure-pages@v6.0.0 (Node 24 runtime, #295)
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload artifact
        # actions/upload-pages-artifact@v5.0.0 (wraps upload-artifact@v7, Node 24 runtime, #297)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: "./docs"

      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages@v5.0.0 (Node 24 runtime, #296)
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
