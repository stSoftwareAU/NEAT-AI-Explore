name: Deploy to GitHub Pages

on:
  push:
    branches: [Develop]
    paths:
      - "docs/**"
      - "scripts/inject_build_id.ts"
      - "version.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Cap the runner so a wedged Pages deploy cannot hold the runner for the
    # GitHub default of 360 minutes (#257).
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Deno
        # denoland/setup-deno@v2.0.4
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Inject build ID into docs (cache busting)
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          deno run --allow-read --allow-write ./scripts/inject_build_id.ts "${GITHUB_SHA::8}"

      - name: Setup Pages
        # Keep this aligned with ../GRQ-health to avoid behavioural differences.
        # actions/configure-pages@v6.0.0 (Node 24 runtime, #295)
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload artifact
        # actions/upload-pages-artifact@v3.0.1
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: "./docs"

      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages@v4.0.5
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
