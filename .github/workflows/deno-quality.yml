name: Deno Quality

on:
  pull_request:
    branches: ["*"]

permissions:
  contents: read

jobs:
  quality:
    # Preserve the previous required-status-check display name after
    # consolidating ci.yml into this workflow (Issue #259).
    name: Quality Gate
    runs-on: ubuntu-latest
    # Cap the runner so a wedged deno test / coverage upload cannot hold the
    # runner for the GitHub default of 360 minutes (#257).
    timeout-minutes: 20
    steps:
      # actions/checkout@v5.0.1
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      # denoland/setup-deno@v2.0.4
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x
      - name: Format check
        run: deno fmt --check
      - name: Lint
        run: deno lint
      - name: Type check
        # Issue #210 — keep aligned with quality.sh; cover docs/ so type
        # errors in the published PWA are not invisible to CI.
        run: deno check helpers/ scripts/ tests/ docs/
      # Run tests with coverage and upload to Codecov (Issue #1636).
      # The codecov-action is a no-op when no test files are found.
      - name: Tests with coverage
        run: deno test -A --coverage=cov_profile
      - name: Generate lcov coverage report
        run: deno coverage cov_profile --lcov --output=coverage.lcov
      # codecov/codecov-action@v5.5.4
      - uses: codecov/codecov-action@aa56896cf108bd10b5eb883cd1d24196da57f695
        with:
          files: coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
