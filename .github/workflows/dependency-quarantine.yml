name: Dependency Quarantine

# Pull-request dependency-age gate (#616).
#
# `upgrade-dependencies.yml` runs the quarantine check before the weekly
# automated bump, but that workflow triggers only on `schedule` /
# `workflow_dispatch`. A pull request that hand-edits `deno.json` /
# `deno.lock` never reached it, so an external package published minutes
# earlier could merge with no publish-age verification at all —
# `dependency-review.yml` and `dependency-audit.yml` check disclosed
# advisories and licences, never publish recency.
#
# This job closes that path. It runs `scripts/jsr_quarantine_check.ts` in
# `--lock` mode, which ages the versions the branch actually *resolves* —
# direct and transitive — rather than the newest release on the registry,
# so an unrelated PR is unaffected by someone else publishing today while a
# freshly-published resolution is blocked.

on:
  pull_request:
    # `*` does not cross a `/`, so it matches single-segment branches
    # (Develop, main) but never a `milestone/<slug>` branch. Add the
    # `milestone/*` glob so this gate also runs on milestone sub-issue PRs
    # (#497); without it those PRs merge into the milestone branch unchecked.
    branches: ["*", "milestone/*"]
  workflow_dispatch:

# Cancel superseded runs when a PR receives a new commit so the latest push
# gets feedback fastest and we do not waste runner minutes on stale work
# (#258).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: the gate only reads the checked-out manifest and lockfile.
permissions:
  contents: read

jobs:
  dependency-quarantine:
    runs-on: ubuntu-latest
    # Cap the runner so a hung registry request cannot hold it for the GitHub
    # default of 360 minutes (#257). The gate is one HTTP request per resolved
    # package and completes in well under a minute.
    timeout-minutes: 10
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # The gate only reads deno.json / deno.lock; it never pushes back or
          # fetches private submodules, so the GITHUB_TOKEN must not be written
          # to .git/config where a compromised step could read it (#616).
          persist-credentials: false
      # denoland/setup-deno@v2.0.4
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x
      - name: Resolved dependency quarantine gate
        # Fails the PR when any version resolved in deno.lock was published
        # less than VIBE_BUMP_QUARANTINE_HOURS hours ago, when deno.json
        # declares an import the lockfile does not resolve (a stale lockfile
        # would otherwise hide the new dependency), or when a specifier cannot
        # be age-checked at all.
        env:
          VIBE_BUMP_QUARANTINE_HOURS: ${{ vars.VIBE_BUMP_QUARANTINE_HOURS || '24' }}
        run: |
          set -euo pipefail
          set -E # errtrace: keep ERR traps in functions/subshells (#557)
          # `--allow-env` is required: without it the gate cannot read the
          # window variable and dies with a permission error before it checks
          # anything (#616).
          deno run --allow-read \
            --allow-env=VIBE_BUMP_QUARANTINE_HOURS \
            --allow-net=api.jsr.io,registry.npmjs.org \
            scripts/jsr_quarantine_check.ts --lock deno.lock deno.json
