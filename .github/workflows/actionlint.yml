name: actionlint

# Lint every GitHub Actions workflow with actionlint (#292) so workflow
# regressions — bad `${{ }}` expressions, undefined `needs:`, invalid event
# filters, shellcheck issues in `run:` blocks — fail the build instead of
# landing silently.
#
# actionlint has no first-party GitHub Action; the maintainer ships a Go
# binary plus an official install script. We download that script from an
# immutable commit SHA, verify its SHA-256 against a value pinned here, and
# install a pinned binary version in a `run:` step rather than depend on an
# unofficial third-party action, keeping the supply-chain surface to repos we
# already trust (actions/checkout + rhysd/actionlint).

# actionlint is a checker: it gates pull requests only. It deliberately does
# not trigger on `push:` to the default branch — the post-merge run would just
# duplicate the check that already passed on the PR, wasting runner minutes and
# risking a red tick on the default branch for an already-green check (#453).
on:
  pull_request:
    # `*` does not cross a `/`, so it matches single-segment branches
    # (Develop, main) but never a `milestone/<slug>` branch. Add the
    # `milestone/*` glob so this gate also runs on milestone sub-issue PRs
    # (#492); without it those PRs merge into the milestone branch unchecked.
    branches: ["*", "milestone/*"]
  workflow_dispatch:

# Cancel superseded runs when a PR receives a new commit so the latest push
# gets feedback fastest and we do not waste runner minutes on stale work
# (#258). The group keys on workflow + ref so PR and branch-push runs do not
# cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pin the actionlint release so CI behaviour is reproducible and a moving
  # tag cannot silently change the linter.
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  actionlint:
    runs-on: ubuntu-latest
    # Cap the runner so a wedged lint cannot hold it for the GitHub default
    # of 360 minutes (#257). actionlint scans a handful of files in seconds.
    timeout-minutes: 5
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # This job only reads workflow files to lint them; it never pushes
          # back or fetches private submodules, so the GITHUB_TOKEN must not be
          # written to .git/config where a later step could read it (#456).
          persist-credentials: false
      - name: Install actionlint
        env:
          # Pin the install script to the immutable commit SHA the v1.7.12 tag
          # pointed at, not the tag itself (#618). A tag can be force-moved by
          # a compromised upstream account to point at new content, and this
          # script is executed with bash on the runner — the same trust
          # decision every `uses:` in this repo already SHA-pins.
          SCRIPT_URL: https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash
          # SHA-256 of that exact script, verified before it runs. Defence in
          # depth over the SHA-pinned URL: a substituted response fails the
          # check instead of executing. Mirrors quality/gitleaks_scan.sh.
          SCRIPT_SHA256: 72fa3e45ac20f3c3a512d6747b4fcf719e21f890e8c43e78d48a41fdfb900c4e
        run: |
          set -euo pipefail
          curl -fsSL "$SCRIPT_URL" -o download-actionlint.bash
          # Fail loud on any mismatch: sha256sum -c exits non-zero and `set -e`
          # aborts the step before the script is ever executed.
          printf '%s  %s\n' "$SCRIPT_SHA256" download-actionlint.bash \
            | sha256sum -c -
          bash download-actionlint.bash "$ACTIONLINT_VERSION"
          # The script drops the binary in the working directory; record its
          # path for the next step.
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Run actionlint
        run: actionlint -color
