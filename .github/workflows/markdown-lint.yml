name: Markdown Lint

# Markdown Lint is a checker: it gates pull requests only. It deliberately does
# not trigger on `push:` to the default branch — the post-merge run would just
# duplicate the check that already passed on the PR, wasting runner minutes and
# risking a red tick on the default branch for an already-green check (#454).
on:
  pull_request:
    # `*` stops at `/`, so it never matches a `milestone/<slug>` branch. List
    # `milestone/*` explicitly so the gate runs on milestone sub-issue PRs too
    # and they do not merge into the shared milestone branch unchecked (#495).
    branches: ["*", "milestone/*"]
  workflow_dispatch:

# Cancel superseded runs when a PR receives a new commit so the latest push
# gets feedback fastest and we do not waste runner minutes on stale work
# (#258). The group keys on workflow + ref so PR and branch-push runs do not
# cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    # Cap the runner so a wedged markdownlint scan cannot hold the runner
    # for the GitHub default of 360 minutes (#257).
    timeout-minutes: 5
    steps:
      # actions/checkout@v6.0.2
      # persist-credentials: false — this job only lints Markdown; it never
      # pushes back or fetches private submodules, so the GITHUB_TOKEN must not
      # be written to .git/config where a later step could read it (#461).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # actions/setup-node@v6.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "lts/*"
      # Pinned to an exact version (#610). An unpinned `npm install -g`
      # resolves whatever the registry serves at that moment, so a hijacked
      # release runs on the runner the instant it is published — and a `run:`
      # block is not a manifest, so Renovate's quarantine window never
      # covers it. Matches the pin used by NEAT-AI-Backpropagation and
      # NEAT-AI-Lamarck.
      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.23.2
      - name: Run markdownlint-cli2
        run: markdownlint-cli2
