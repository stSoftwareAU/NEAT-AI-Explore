name: Gitleaks

# Detect secrets in pull request diffs using gitleaks-action.
#
# Mirrors the canonical NEAT-AI pattern at
# stSoftwareAU/NEAT-AI/.github/workflows/quality.yml. Third-party
# actions are pinned to 40-character commit SHAs (Issue #1756) so a
# hijacked tag cannot exfiltrate CI secrets.

on:
  pull_request:
    # `*` stops at `/`, so it never matches a `milestone/<slug>` branch. List
    # `milestone/*` explicitly so the secret-scan gate runs on milestone
    # sub-issue PRs too and they do not merge into the shared milestone branch
    # unchecked (#494).
    branches: ["*", "milestone/*"]

# Cancel superseded runs when a PR receives a new commit so the latest push
# gets feedback fastest and we do not waste runner minutes on stale work
# (#258).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    # Cap the runner so a wedged gitleaks scan cannot hold the runner for the
    # GitHub default of 360 minutes (#257).
    timeout-minutes: 10
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      # Fetch the PR base branch so gitleaks-action's computed commit
      # range (`<base_sha>^..<head_sha>`) resolves on the runner.
      # Without this step the action fails with
      # "fatal: Invalid revision range" because the base ref's parent
      # is not in the shallow checkout (Issue #1756). Mirrors the
      # NEAT-AI quality.yml pattern.
      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF:$BASE_REF" || true
      # gitleaks/gitleaks-action@v3.0.0 (runs on the supported Node 24
      # runtime; v2.3.9 ran on the deprecated Node 20 — Issue #298).
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Org-level Gitleaks Pro licence (Issue #1636). Required for
          # repos under stSoftwareAU/*; without it gitleaks-action exits
          # with ErrLicense before scanning. Configure in repo or org
          # secrets.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
