<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Content-Security-Policy (Issue #218). GitHub Pages does not set CSP
      response headers, so the policy is declared here as a meta tag. Keep
      `connect-src` in sync with docs/shared/config.js ALLOWED_SNAPSHOT_ORIGINS.
      Inline `script` blocks are forbidden by this policy — boot code lives in
      ./boot.js so `script-src 'self'` can stay strict.

      Note: `frame-ancestors`, `sandbox`, and `report-uri` are spec'd to be
      ignored when delivered via a meta tag (CSP3 §3.4), so we omit them here
      and rely on the platform default (clickjacking via iframe-embed is not
      a current threat for a same-origin viewer). Clickjacking protection
      would require an X-Frame-Options or frame-ancestors HTTP header, which
      GitHub Pages does not let us set.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://stsoftwareau.github.io https://raw.githubusercontent.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>NEAT-AI Explore</title>
    <link rel="stylesheet" href="./styles.css?v=__BUILD_ID__" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Match the CSS default (light) and override via prefers-colour-scheme. -->
    <meta name="theme-color" content="#f5f7fb" />
    <meta
      name="theme-color"
      content="#0a0e1a"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="./favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./icons/icon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./icons/icon-16x16.png"
    />
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png" />
  </head>
  <body>
    <header class="appHeader">
      <h1>NEAT-AI Explore</h1>
      <div class="headerControls">
        <details class="headerUrlDetails" open>
          <summary>Load snapshot…</summary>
          <div class="headerUrlInner">
            <input
              id="fetchUrl"
              class="input"
              aria-label="Snapshot URL"
              placeholder="https://stsoftwareau.github.io/NEAT-AI-Snapshot/snapshot.json.gz"
            />
            <button id="fetchBtn" class="button">Fetch</button>
            <input
              id="fileInput"
              type="file"
              accept="application/json, .json, .gz, application/gzip, application/x-gzip"
              aria-label="Load snapshot file"
              style="display: none"
            />
            <div class="browseGroup">
              <button id="fileBtn" class="button">Browse…</button>
            </div>
          </div>
        </details>
        <div
          id="progressContainer"
          class="progressContainer"
          style="display: none"
        >
          <div id="progressBar" class="progressBar"></div>
        </div>
        <span id="status" class="statusInline" role="status" aria-live="polite"
        >Loading…</span>
        <button id="themeToggle" class="button themeToggle" aria-label="Theme">
          🌓
        </button>
      </div>
    </header>

    <!-- Creature overview dashboard (shown after snapshot loads, before neuron exploration) -->
    <section
      id="overviewDashboard"
      class="overviewDashboard"
      style="display: none"
    >
      <div class="overviewGrid">
        <div class="overviewCard overviewCardMetrics">
          <h2 class="overviewCardTitle">Network Summary</h2>
          <dl id="overviewMetrics" class="overviewMetricsList"></dl>
        </div>
        <div class="overviewCard overviewCardActivation">
          <h2 class="overviewCardTitle">Activation Functions</h2>
          <div id="overviewActivation" class="overviewActivationList"></div>
        </div>
        <div class="overviewCard overviewCardTopology">
          <h2 class="overviewCardTitle">Network Topology</h2>
          <div id="overviewTopology" class="overviewTopologyDiagram"></div>
        </div>
      </div>
      <div class="overviewActions">
        <button id="overviewExploreBtn" class="button">
          Explore Neurons →
        </button>
      </div>
    </section>

    <main class="explorer" style="display: none">
      <!-- Trace breadcrumb at top -->
      <nav class="traceBar" aria-label="Trace path">
        <span class="pathLabel">Path:</span>
        <span
          id="traceScore"
          class="traceScore"
          aria-label="Current neuron impact"
          title="Current neuron impact (share of output influence)"
          hidden
        ></span>
        <ol id="traceBreadcrumb" class="breadcrumb"></ol>
        <div class="traceButtons">
          <button id="traceBackBtn" class="button buttonSmall">← Back</button>
          <button id="traceClearBtn" class="button buttonSmall buttonSecondary">
            Clear
          </button>
          <!--
            Issue #184 / Issue #204: the single #themeToggle (declared in
            .headerControls) is moved here by syncThemeTogglePlacement() on
            phone viewports so the header doesn't waste a row. There is no
            duplicate trace-only button — keeping two caused the "two A
            buttons" bug reported in #204.
          -->
          <!--
            Issue #184: overflow wrapper. On desktop it is transparent
            (display: contents) so the children flow inline as before. On
            phone the .traceOverflowSummary button toggles
            .traceOverflowMenu as a popup so Back/Clear stay visible while
            Observations/🧠/Synapses collapse into a single overflow.
          -->
          <div
            class="traceOverflow"
            data-overflow-open="false"
          >
            <button
              type="button"
              class="button buttonSmall buttonSecondary traceOverflowSummary"
              aria-label="More actions"
              aria-haspopup="true"
              aria-expanded="false"
              title="More actions"
            >
              ⋯
            </button>
            <div class="traceOverflowMenu" role="menu">
              <button
                id="obsBtn"
                class="button buttonSmall buttonSecondary"
                role="menuitem"
              >
                Observations
              </button>
              <a
                id="graphBtn"
                class="button buttonSmall buttonSecondary"
                href="./graph/"
                aria-label="Open 3D neural network view"
                title="Open 3D neural network view"
                role="menuitem"
              >🧠</a>
              <a
                id="dagBtn"
                class="button buttonSmall buttonSecondary"
                href="./dag/"
                aria-label="Open layered DAG view"
                title="Open layered DAG view"
                role="menuitem"
              >🕸️</a>
              <button
                id="synapsePanelToggle"
                class="button buttonSmall buttonSecondary synapsePanelToggle"
                aria-label="Toggle synapse panel"
                title="Toggle synapse panel"
                role="menuitem"
              >
                Synapses ⇄
              </button>
            </div>
          </div>
        </div>
      </nav>

      <!-- Main exploration area: left-to-right flow -->
      <div class="explorerMain">
        <!-- Current neuron (left) -->
        <section class="currentNeuron">
          <h2 id="currentNeuronTitle">output-0</h2>
          <div id="neuronProps" class="neuronCards"></div>

          <div class="tabRow" role="tablist" aria-label="Neuron panels">
            <button
              id="neuronTabDetails"
              class="tabBtn isActive"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="neuronTabPanelDetails"
            >
              Details
            </button>
            <button
              id="neuronTabIssues"
              class="tabBtn"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="neuronTabPanelIssues"
            >
              Issues
            </button>
            <button
              id="neuronTabCandidates"
              class="tabBtn"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="neuronTabPanelCandidates"
            >
              Candidates
            </button>
          </div>

          <div
            id="neuronTabPanelDetails"
            class="tabPanel isActive"
            role="tabpanel"
            aria-labelledby="neuronTabDetails"
          >
            <div id="impactBreakdown" class="impactBreakdown"></div>
            <div id="impactDiagnosticsPanel" class="impactBreakdown"></div>
            <div
              id="observationContributionsPanel"
              class="impactBreakdown observationContributions"
            ></div>
          </div>
          <div
            id="neuronTabPanelIssues"
            class="tabPanel"
            role="tabpanel"
            aria-labelledby="neuronTabIssues"
          ></div>
          <div
            id="neuronTabPanelCandidates"
            class="tabPanel"
            role="tabpanel"
            aria-labelledby="neuronTabCandidates"
          ></div>
        </section>

        <!-- Arrow -->
        <div class="flowArrow">←</div>

        <!-- Inbound synapses list (right) -->
        <section class="synapseList">
          <div class="synapseHeader" data-filters-mode="inline">
            <h2>
              Inbound Synapses <span id="synapseCount" class="badge">0</span>
            </h2>
            <div class="synapseTools">
              <div class="sortControls">
                <label for="synapseSort">Sort by:</label>
                <select id="synapseSort" class="select">
                  <option value="allocImpact">
                    Allocated impact ↓ (into current)
                  </option>
                  <option value="allocImpactAsc">
                    Allocated impact ↑ (into current)
                  </option>
                  <option value="impact">Source impact ↓ (highest)</option>
                  <option value="impactAsc">
                    Source impact ↑ (lowest - prunable?)
                  </option>
                  <option value="mse">MSE (source)</option>
                  <option value="absWeight">|Weight|</option>
                  <option value="absContribution">|Contribution|</option>
                  <option value="weight">Weight</option>
                </select>
              </div>

              <!--
                Issue #245 — render filter inputs inline by default. When the
                row would overflow, JS toggles `data-filters-mode="collapsed"`
                on .synapseHeader; CSS then hides the inline panel and shows
                the Filters button which reveals the same panel as a popover.
              -->
              <button
                id="synapseFiltersToggle"
                type="button"
                class="button buttonSmall buttonSecondary synapseFiltersToggle"
                aria-expanded="false"
                aria-controls="synapseFilterPanel"
              >
                Filters
              </button>
              <div
                id="synapseFilterPanel"
                class="filterPanel"
                role="group"
                aria-label="Inbound filters"
              >
                <label class="filterItem">
                  <span>Min alloc imp</span>
                  <input
                    id="synapseMinAlloc"
                    class="input inputSmall"
                    inputmode="decimal"
                    placeholder="0"
                  />
                </label>
                <label class="filterItem">
                  <span>Top</span>
                  <select id="synapseTopK" class="select selectSmall">
                    <option value="50">50</option>
                    <option value="80">80</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                    <option value="500">500</option>
                    <option value="0">All</option>
                  </select>
                </label>
              </div>
            </div>
          </div>
          <div id="synapseListContainer" class="synapseListScroll"></div>
        </section>
      </div>

      <!-- Mobile bottom tab bar (#108) -->
      <nav class="mobileTabBar" aria-label="Mobile navigation">
        <button
          class="mobileTabBtn isActive"
          data-tab="neuronTabPanelDetails"
          type="button"
        >
          <span class="mobileTabIcon" aria-hidden="true">📋</span>
          Details
        </button>
        <button
          class="mobileTabBtn"
          data-tab="neuronTabPanelIssues"
          type="button"
        >
          <span class="mobileTabIcon" aria-hidden="true">⚠️</span>
          Issues
        </button>
        <button
          class="mobileTabBtn"
          data-tab="neuronTabPanelCandidates"
          type="button"
        >
          <span class="mobileTabIcon" aria-hidden="true">🔬</span>
          Candidates
        </button>
      </nav>
    </main>

    <!--
      Boot script extracted to ./boot.js so the page can declare a strict
      Content-Security-Policy with `script-src 'self'` (no 'unsafe-inline').
      See Issue #218.
    -->
    <script type="module" src="./boot.js?v=__BUILD_ID__"></script>

    <!-- Impact path inspector modal (for "show your working"). -->
    <div id="pathModal" class="modal" aria-hidden="true">
      <div id="pathModalBackdrop" class="modalBackdrop"></div>
      <div
        class="modalPanel"
        role="dialog"
        aria-modal="true"
        aria-label="Impact path inspector"
      >
        <div class="modalHeader">
          <div id="pathModalTitle" class="modalTitle">
            Impact path inspector
          </div>
          <button
            id="pathModalClose"
            class="button buttonSmall buttonSecondary"
            type="button"
          >
            Close
          </button>
        </div>
        <div id="pathModalBody" class="modalBody"></div>
        <div class="modalFooter">
          <button id="pathModalMore" class="button buttonSmall" type="button">
            Show more
          </button>
        </div>
      </div>
    </div>

    <!--
      Topology pop-out modal (Issue #241). Landscape (wider-than-tall) modal
      that shows the upgraded topology diagram + legend at a larger size when
      the user clicks the in-place diagram. Backdrop is a full-viewport
      sibling so the .topoModal panel can carry the landscape aspect-ratio
      sizing directly.
    -->
    <div class="topoModalBackdrop" hidden></div>
    <div
      id="topoModal"
      class="topoModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="topoModalTitle"
      hidden
    >
      <button
        type="button"
        class="topoModalClose"
        aria-label="Close"
      >
        ×
      </button>
      <h2 id="topoModalTitle">Network topology</h2>
      <div id="topoModalBody"></div>
    </div>

    <!-- Observations dashboard modal (unused inputs, redundancy, reachability). -->
    <div id="obsModal" class="modal" aria-hidden="true">
      <div id="obsModalBackdrop" class="modalBackdrop"></div>
      <div
        class="modalPanel"
        role="dialog"
        aria-modal="true"
        aria-label="Observations dashboard"
      >
        <div class="modalHeader">
          <div id="obsModalTitle" class="modalTitle">Observations</div>
          <button
            id="obsModalClose"
            class="button buttonSmall buttonSecondary"
            type="button"
          >
            Close
          </button>
        </div>
        <div id="obsModalBody" class="modalBody"></div>
      </div>
    </div>

    <!-- Service worker registration moved into the module bootstrap above. -->
  </body>
</html>
