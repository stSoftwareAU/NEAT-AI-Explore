<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NEAT-AI Explore</title>
    <link rel="stylesheet" href="./styles.css?v=__BUILD_ID__" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Match the CSS default (light) and override via prefers-colour-scheme. -->
    <meta name="theme-color" content="#f5f7fb" />
    <meta
      name="theme-color"
      content="#0a0e1a"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="./favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./icons/icon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./icons/icon-16x16.png"
    />
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png" />
  </head>
  <body>
    <header class="appHeader">
      <h1>NEAT-AI Explore</h1>
      <div class="headerControls">
        <input
          id="fetchUrl"
          class="input"
          placeholder="https://stsoftwareau.github.io/NEAT-AI-Snapshot/snapshot.json.gz"
        />
        <button id="fetchBtn" class="button">Fetch</button>
        <input
          id="fileInput"
          type="file"
          accept="application/json,.json,.gz,application/gzip,application/x-gzip"
          style="display: none"
        />
        <div class="browseGroup">
          <button id="fileBtn" class="button">Browse…</button>
        </div>
        <div
          id="progressContainer"
          class="progressContainer"
          style="display: none"
        >
          <div id="progressBar" class="progressBar"></div>
        </div>
        <span id="status" class="statusInline"></span>
      </div>
    </header>

    <main class="explorer">
      <!-- Trace breadcrumb at top -->
      <nav class="traceBar">
        <span class="traceLabel">Trace:</span>
        <ol id="traceBreadcrumb" class="breadcrumb"></ol>
        <button id="traceBackBtn" class="button buttonSmall">← Back</button>
        <button id="traceClearBtn" class="button buttonSmall buttonSecondary">
          Clear
        </button>
        <button id="obsBtn" class="button buttonSmall buttonSecondary">
          Observations
        </button>
        <a
          id="graphBtn"
          class="button buttonSmall buttonSecondary"
          href="./graph/"
          aria-label="Open 3D graph view"
          title="Open 3D graph view (new tab recommended)"
        >
          3D Graph
        </a>
      </nav>

      <!-- Main exploration area: left-to-right flow -->
      <div class="explorerMain">
        <!-- Current neuron (left) -->
        <section class="currentNeuron">
          <h2 id="currentNeuronTitle">output-0</h2>
          <dl id="neuronProps" class="propList"></dl>

          <div class="tabRow" role="tablist" aria-label="Neuron panels">
            <button
              id="neuronTabDetails"
              class="tabBtn isActive"
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="neuronTabPanelDetails"
            >
              Details
            </button>
            <button
              id="neuronTabIssues"
              class="tabBtn"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="neuronTabPanelIssues"
            >
              Issues
            </button>
            <button
              id="neuronTabCandidates"
              class="tabBtn"
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="neuronTabPanelCandidates"
            >
              Candidates
            </button>
          </div>

          <div
            id="neuronTabPanelDetails"
            class="tabPanel isActive"
            role="tabpanel"
          >
            <div id="impactBreakdown" class="impactBreakdown"></div>
            <div id="impactDiagnosticsPanel" class="impactBreakdown"></div>
            <div id="topInputsPanel" class="impactBreakdown"></div>
          </div>
          <div id="neuronTabPanelIssues" class="tabPanel" role="tabpanel"></div>
          <div
            id="neuronTabPanelCandidates"
            class="tabPanel"
            role="tabpanel"
          >
          </div>
        </section>

        <!-- Arrow -->
        <div class="flowArrow">←</div>

        <!-- Inbound synapses list (right) -->
        <section class="synapseList">
          <div class="synapseHeader">
            <h2>
              Inbound Synapses <span id="synapseCount" class="badge">0</span>
            </h2>
            <div class="synapseTools">
              <div class="sortControls">
                <label>Sort by:</label>
                <select id="synapseSort" class="select">
                  <option value="allocImpact">
                    Allocated impact ↓ (into current)
                  </option>
                  <option value="allocImpactAsc">
                    Allocated impact ↑ (into current)
                  </option>
                  <option value="impact">Source impact ↓ (highest)</option>
                  <option value="impactAsc">
                    Source impact ↑ (lowest - prunable?)
                  </option>
                  <option value="mse">MSE (source)</option>
                  <option value="absWeight">|Weight|</option>
                  <option value="absContribution">|Contribution|</option>
                  <option value="weight">Weight</option>
                </select>
              </div>

              <details class="filterDetails">
                <summary class="button buttonSmall buttonSecondary">
                  Filters
                </summary>
                <div
                  class="filterPanel"
                  role="group"
                  aria-label="Inbound filters"
                >
                  <label class="filterItem">
                    <span>Min alloc imp</span>
                    <input
                      id="synapseMinAlloc"
                      class="input inputSmall"
                      inputmode="decimal"
                      placeholder="0"
                    />
                  </label>
                  <label class="filterItem">
                    <span>Top</span>
                    <select id="synapseTopK" class="select selectSmall">
                      <option value="50">50</option>
                      <option value="80">80</option>
                      <option value="100">100</option>
                      <option value="200">200</option>
                      <option value="500">500</option>
                      <option value="0">All</option>
                    </select>
                  </label>
                  <label class="filterItem filterCheckbox">
                    <input id="synapseTraceOnly" type="checkbox" />
                    <span>Trace only</span>
                  </label>
                </div>
              </details>
            </div>
          </div>
          <div id="synapseListContainer" class="synapseListScroll"></div>
        </section>
      </div>
    </main>

    <script type="module">
      // Register the Service Worker *before* importing the app module.
      //
      // Issue #22 (28-Dec-2025): the app auto-loads the default snapshot on
      // startup, and some environments (notably iOS/PWA) can fail the first
      // fetch until the Service Worker has installed/activated. By awaiting
      // SW readiness here, we avoid a first-load failure that succeeds on
      // manual retry.
      //
      // Issue #23 (29-Dec-2025): `navigator.serviceWorker.ready` never rejects
      // and can remain pending forever if installation/activation fails (e.g.
      // quota exceeded, privacy mode restrictions, or an unhandled SW install
      // error). Use a timeout so the app still boots in degraded mode.
      (async () => {
        if ("serviceWorker" in navigator) {
          try {
            await navigator.serviceWorker.register(
              "./sw.js?v=__BUILD_ID__",
            );
            const sleep = (ms) =>
              new Promise((resolve) => setTimeout(resolve, ms));
            await Promise.race([
              navigator.serviceWorker.ready,
              sleep(2000),
            ]);
          } catch (err) {
            console.warn("SW registration failed:", err);
          }
        }

        // Start the app once SW registration has had a chance to settle.
        //
        // Dev ergonomics:
        // On local servers, `__BUILD_ID__` is not replaced, so `app.js?v=__BUILD_ID__`
        // can get cached aggressively by browsers. When we detect the placeholder,
        // fall back to a time-based cache buster so local iteration is reliable.
        const buildId = "__BUILD_ID__";
        const v = buildId.includes("__BUILD_ID__")
          ? String(Date.now())
          : buildId;
        await import(`./app.js?v=${v}`);
      })();
    </script>

    <!-- Impact path inspector modal (for "show your working"). -->
    <div id="pathModal" class="modal" aria-hidden="true">
      <div id="pathModalBackdrop" class="modalBackdrop"></div>
      <div
        class="modalPanel"
        role="dialog"
        aria-modal="true"
        aria-label="Impact path inspector"
      >
        <div class="modalHeader">
          <div id="pathModalTitle" class="modalTitle">
            Impact path inspector
          </div>
          <button
            id="pathModalClose"
            class="button buttonSmall buttonSecondary"
            type="button"
          >
            Close
          </button>
        </div>
        <div id="pathModalBody" class="modalBody"></div>
        <div class="modalFooter">
          <button id="pathModalMore" class="button buttonSmall" type="button">
            Show more
          </button>
        </div>
      </div>
    </div>

    <!-- Observations dashboard modal (unused inputs, redundancy, reachability). -->
    <div id="obsModal" class="modal" aria-hidden="true">
      <div id="obsModalBackdrop" class="modalBackdrop"></div>
      <div
        class="modalPanel"
        role="dialog"
        aria-modal="true"
        aria-label="Observations dashboard"
      >
        <div class="modalHeader">
          <div id="obsModalTitle" class="modalTitle">Observations</div>
          <button
            id="obsModalClose"
            class="button buttonSmall buttonSecondary"
            type="button"
          >
            Close
          </button>
        </div>
        <div id="obsModalBody" class="modalBody"></div>
      </div>
    </div>

    <!-- Explain \"why this score\" modal (top contributing observations). -->
    <div id="explainModal" class="modal" aria-hidden="true">
      <div id="explainModalBackdrop" class="modalBackdrop"></div>
      <div
        class="modalPanel"
        role="dialog"
        aria-modal="true"
        aria-label="Top contributing observations"
      >
        <div class="modalHeader">
          <div id="explainModalTitle" class="modalTitle">
            Top contributing observations
          </div>
          <button
            id="explainModalClose"
            class="button buttonSmall buttonSecondary"
            type="button"
          >
            Close
          </button>
        </div>
        <div id="explainModalBody" class="modalBody"></div>
      </div>
    </div>

    <!-- Service worker registration moved into the module bootstrap above. -->
  </body>
</html>
